name: liga-cards

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: liga_cards
      DB_USERNAME: liga_app
      DB_PASSWORD: ${DB_PASSWORD:-liga_local_dev}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: liga_cards
      MYSQL_USER: liga_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-liga_local_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-liga_root_local_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
